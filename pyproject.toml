[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-gliner-kg"
version = "0.1.0"
description = "Cascaded clinical extraction: GLiNER 2.5, spaCy, gliner-spacy, ontology grounding, and spaCy-LLM adjudication into a provenance-aware healthcare KG."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yogesh Parte"}]
keywords = ["GLiNER", "spaCy", "clinical-NLP", "knowledge-graph", "PHI", "healthcare"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
]

[project.optional-dependencies]
spacy = ["spacy>=3.7.4"]
gliner = ["gliner>=0.2.8", "gliner-spacy>=0.0.8"]
gliner2 = ["gliner2[local]>=0.1.0"]
llm = ["spacy-llm>=0.7.2"]
graph = ["networkx>=3.2.1", "rdflib>=7.0.0"]
all = [
  "spacy>=3.7.4",
  "gliner>=0.2.8",
  "gliner-spacy>=0.0.8",
  "gliner2[local]>=0.1.0",
  "spacy-llm>=0.7.2",
  "networkx>=3.2.1",
  "rdflib>=7.0.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[project.urls]
Homepage = "https://github.com/YPCC/clinical-gliner-kg"
"GLiNER 2.5" = "https://github.com/fastino-ai/GLiNER2"
"Medical data catalog" = "https://github.com/YPCC/medical-data"

[project.scripts]
clinical-gliner = "clinical_gliner_kg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
