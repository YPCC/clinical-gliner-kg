# Gemini via API key (not Vertex ADC) + optional OpenAI-compatible drop-in.
#   cp config/pipeline.google-api-key.example.yaml config/pipeline.local.yaml
#   export GOOGLE_API_KEY=...    # or GEMINI_API_KEY
#   clinical-gliner --config config/pipeline.local.yaml --print-config
#
# Docs: https://ai.google.dev/gemini-api/docs/openai

pipeline_version: 0.1.0-cascaded
backend: auto
confidence_threshold: 0.75

clinical_labels: [Patient, Condition, Medication, Laboratory_Test, Laboratory_Result, Anatomy, Procedure, Provider]
relation_types: [HAS_CONDITION, TAKES, TREATS, HAS_VALUE, INDICATES, PERFORMED, HAS_ANATOMICAL_SITE]

gliner:
  mode: local
  model: fastino/gliner2.5-small-v1
  threshold: 0.3
  enable_relations: true
  enable_joint: false
  pii_model: fastino/gliner2-privacy-filter-PII-multi
  huggingface:
    endpoint: https://api-inference.huggingface.co/models
    token_env: HF_TOKEN
  pioneer:
    base_url: https://api.pioneer.ai
    token_env: PIONEER_API_KEY
  spacy:
    model: urchade/gliner_medium-v2.1

oaklib:
  mode: local
  eager: false
  local:
    adapters:
      - simpleobo:data/ontologies/mini_clinical.obo
  ols:
    selectors: [ols4:mondo, ols4:chebi]
  bioportal:
    token_env: BIOPORTAL_API_KEY
    selectors:
      - "bioportal:"

llm:
  provider: google
  enable: true
  openai:
    model: gpt-4o-mini
    token_env: OPENAI_API_KEY
    temperature: 0.0
    base_url: https://api.openai.com/v1
  openai_compat:
    # Any OpenAI-compatible server: Groq, Together, Fireworks, vLLM, Ollama, LiteLLM.
    # To use this instead of Gemini, set provider: openai_compat and token_env below.
    model: llama-3.1-70b-versatile
    token_env: OPENAI_API_KEY
    temperature: 0.0
    base_url: https://api.groq.com/openai/v1
  azure_openai:
    endpoint: ""
    deployment: ""
    api_version: "2024-10-21"
    token_env: AZURE_OPENAI_API_KEY
  google:
    model: gemini-2.0-flash
    token_env: GOOGLE_API_KEY
    temperature: 0.0
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  vertex:
    model: gemini-2.0-flash
    location: us-central1
    temperature: 0.0
  anthropic:
    model: claude-3-5-sonnet-latest
    token_env: ANTHROPIC_API_KEY

gcp:
  use_adc: true
  project: ""
  location: us-central1
  credentials_file: ""
  quota_project: ""

phi:
  action: tag
  enable_gliner_pii: false
