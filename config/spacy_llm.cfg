[nlp]
lang = "en"
pipeline = ["llm"]

[components]

[components.llm]
factory = "llm"
save_io = true

[components.llm.task]
@llm_tasks = "spacy.NER.v3"
labels = ["Condition", "Medication", "Laboratory_Test", "Laboratory_Result", "Anatomy", "Procedure", "Provider"]
description = "Extract and disambiguate complex or disputed clinical entities in medical text. Do not invent identifiers."

[components.llm.task.label_definitions]
Condition = "Diagnoses, problems, and clinical findings such as type 2 diabetes or pneumonia."
Medication = "Drug names, including generic and brand names."
Laboratory_Test = "Named laboratory investigations such as HbA1c or serum creatinine."
Laboratory_Result = "Numeric or qualitative results attached to a laboratory test."
Anatomy = "Body structures or organ systems."
Procedure = "Clinical procedures, operations, or imaging studies."
Provider = "Named clinicians or care-team roles when they are explicit."

[components.llm.model]
@llm_models = "spacy.GPT-4.v3"
config = {"temperature": 0.0}
